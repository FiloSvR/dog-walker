# Copy to ~/.config/dog-walker/config.toml and replace @HOME@ with your home directory
# (TOML does not expand it): sed "s|@HOME@|$HOME|g" manual-tests/config.example.toml
#
# `boss` is the profile of the harness you open yourself. It is never launched here; it only
# satisfies "exactly one main profile".
[profiles.boss]
harness = "claude"
model = "opus"
main = true

# `worker` is the secondary the briefs are delegated to. Change harness, model and the
# directories to try another harness; the tests below do not depend on which one it is.
[profiles.worker]
harness = "pi"
model = "openrouter/z-ai/glm-5.3-flash"
effort = "medium"
env = ["OPENROUTER_API_KEY", "PI_CODING_AGENT_DIR"]
secrets = ["OPENROUTER_API_KEY"]
# Pi's install directory only: not the whole agent directory, which holds auth.json.
read_only_dirs = ["@HOME@/.pi/agent/install"]
# A private, empty Pi config directory (Pi writes lock files in it).
writable_dirs = ["@HOME@/.config/dog-walker/pi-agent"]

# `reviewer` (setup: docs/setup.md) reviews what a worker produced. Claude Code with a SUBSCRIPTION token. With an
# API key instead, list ANTHROPIC_API_KEY in `env` and `secrets` in place of the OAuth token.
[profiles.reviewer]
harness = "claude"
model = "claude-sonnet-5-5"
effort = "high"
env = ["CLAUDE_CODE_OAUTH_TOKEN", "CLAUDE_CONFIG_DIR", "CLAUDE_CODE_TMPDIR", "TMPDIR", "HOME"]
secrets = ["CLAUDE_CODE_OAUTH_TOKEN"]
read_only_dirs = ["@HOME@/.local/share/claude"]
# A private, empty directory: Claude Code cannot read ~/.claude. Its tmp/ lives inside it,
# because the sandbox has no /tmp.
writable_dirs = ["@HOME@/.config/dog-walker/claude-config"]

# `codex` and `dsh`: set up as in docs/setup.md (private homes, env files, install directories).
[profiles.codex]
harness = "codex"
model = "gpt-6.1-terra"
effort = "low"
env = ["CODEX_HOME"]
read_only_dirs = ["@HOME@/.npm-global/lib/node_modules/@openai/codex"]
writable_dirs = ["@HOME@/.config/dog-walker/codex-home"]

[profiles.dsh]
harness = "dsh"
dsh_profile = "headless"
model = "deepseek"
env = ["DEEPSEEK_API_KEY", "DSH_HOME", "TMPDIR"]
secrets = ["DEEPSEEK_API_KEY"]
read_only_dirs = ["@HOME@/.npm-global/lib/node_modules/@deepseek-ai/dsh"]
writable_dirs = ["@HOME@/.config/dog-walker/dsh-home"]
