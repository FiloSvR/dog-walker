[package]
name = "dog-walker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Delegate tasks from a main LLM harness to secondary ones, sandboxed, with a trackable handover document."
license = "MIT"
repository = "https://github.com/FiloSvR/dog-walker"
publish = false

[lib]
name = "dog_walker"
path = "src/lib.rs"

[[bin]]
name = "dog-walker"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
signal-hook = { version = "=0.4.6", default-features = false }
thiserror = "=2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Loosened pedantic lints, each with its reason (docs/agents/review.md):
# - module_name_repetitions: `ConfigError` in `error` and `ProfileName` in `config` read better in full.
# - missing_errors_doc: errors are one enum per module, documented on the enum, not on every function.
# - must_use_candidate: flags every small getter; unused results are caught by `unused_must_use`.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
