[package]
name = "dog-walker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Delegate tasks from a main LLM harness to secondary ones, sandboxed, with a trackable handover document."
license = "MIT"
repository = "https://github.com/FiloSvR/dog-walker"
publish = false

[lib]
name = "dog_walker"
path = "src/lib.rs"

[[bin]]
name = "dog-walker"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
thiserror = "=2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
